name: Telegram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 290

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ffmpeg, deno and latest yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          # apt yt-dlp version එක පරණ නිසා latest release එක direct download කරනවා
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          # YouTube JS challenge වලට deno runtime එක ඕන
          curl -fsSL https://deno.land/install.sh | sudo DENO_INSTALL=/usr/local sh
          yt-dlp --version
          deno --version

      - name: Install dependencies
        run: npm install

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OMDB_API: ${{ secrets.OMDB_API }}
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
        run: node index.js
