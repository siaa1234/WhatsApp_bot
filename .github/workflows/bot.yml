name: Telegram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Debug - Show files
        run: |
          pwd
          ls -la

      - name: Install dependencies (direct install)
        run: npm install telegraf btch-downloader

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          # index.js repo එකේ තියෙනවා නම් ඒක run කරනවා
          if [ -f index.js ]; then
            node index.js
          else
            echo "❌ index.js එක repo එකේ හම්බුනේ නෑ!"
            echo "GitHub repo එකේ index.js file එක commit කරන්න ඕන."
            exit 1
          fi
