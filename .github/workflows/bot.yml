name: Run Telegram Bot

on:
  workflow_dispatch:        # Actions tab එකෙන් manual start කරන්න
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'   # පැය 6කට වරක් auto restart (job limit එක 6h නිසා)

# Bot instance එකක් විතරක් run වෙන්න (නැත්නම් Telegram 409 Conflict error එනවා)
concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Create YouTube cookies file (optional)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s\n' "$YT_COOKIES" > cookies.txt
            echo "cookies.txt created"
          else
            echo "YT_COOKIES secret not set, skipping"
          fi

      - name: Start bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OMDB_API: ${{ secrets.OMDB_API }}
        run: node index.js
