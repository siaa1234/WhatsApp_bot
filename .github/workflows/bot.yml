name: Telegram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Debug - Show files
        run: |
          pwd
          ls -la
          echo "--- checking alive.jpg ---"
          ls -lh alive.jpg || echo "❌ alive.jpg not found in root!"

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          else
            npm install telegraf btch-downloader
          fi

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OMDB_API: ${{ secrets.OMDB_API }}
        run: |
          if [ -f index.js ]; then
            node index.js
          else
            echo "❌ index.js එක repo එකේ හම්බුනේ නෑ!"
            exit 1
          fi
