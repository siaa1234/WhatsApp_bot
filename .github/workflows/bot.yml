name: Telegram Bot

on:
  workflow_dispatch:      # Manual start button
  schedule:
    - cron: '0 */5 * * *' # පැය 5න් පස්සේ auto restart (6h limit එකට කලින්)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 6h limit එකට කලින් ම stop වෙන්න

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: node index.js
