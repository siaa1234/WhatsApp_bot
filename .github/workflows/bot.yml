name: Telegram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    services:
      telegram-bot-api:
        image: aiogram/telegram-bot-api:latest
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        ports:
          - 8081:8081

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Debug - Show files
        run: |
          pwd
          ls -la

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          else
            npm init -y
          fi
          npm install telegraf@^4.16.3 sinhalasub.lk@latest @sl-code-lords/movie-api@latest

      - name: Verify dependencies
        run: |
          node -e "require('telegraf'); console.log('✅ telegraf OK')" || echo "⚠️ telegraf missing"
          node -e "require('sinhalasub.lk'); console.log('✅ sinhalasub.lk OK')" || echo "⚠️ sinhalasub.local OK"
          node -e "require('@sl-code-lords/movie-api'); console.log('✅ movie-api OK')" || echo "⚠️ movie-api missing"

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OMDB_API: ${{ secrets.OMDB_API }}
          LOCAL_BOT_API: http://localhost:8081
        run: |
          if [ -f index.js ]; then
            node index.js
          else
            echo "❌ index.js එක repo එකේ හම්බුනේ නෑ!"
            exit 1
          fi
